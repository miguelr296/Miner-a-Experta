name: Pruebas de Nivel 1

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Python 3.12 en ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar proyecto y herramientas de prueba
        run: python -m pip install -e . -r requirements-dev.txt
      - name: Comprobar dependencias
        run: python -m pip check
      - name: Ejecutar suite completa
        run: python -m pytest -q
      - name: Escenario de gases
        run: python -m mina_experta --escenario data/escenarios/nivel1_gases.json
      - name: Escenario de derrumbe
        run: python -m mina_experta --escenario data/escenarios/nivel1_derrumbe.json
      - name: Escenario de riesgo vecino y explicación
        run: python -m mina_experta --escenario data/escenarios/nivel1_riesgo_vecino.json --explicar tunel_10_12
